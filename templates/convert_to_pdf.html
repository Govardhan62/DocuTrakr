{% extends "base.html" %}

{% block title %}Convert DOCX → PDF{% endblock %}

{% block content %}
<section class="bg-white rounded-2xl border p-12 text-center shadow">
  <h2 class="text-4xl font-extrabold text-blue-700 mb-6">
    Upload DOCX ➜ Get PDF
  </h2>
  <form method="post" enctype="multipart/form-data" class="space-y-6">
    {% csrf_token %}
    <input
      type="file"
      name="file"
      accept=".docx"
      required
      class="w-full border border-blue-300 bg-blue-50 text-gray-800 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
    <button
      type="submit"
      class="px-12 py-4 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-lg font-semibold transition"
    >
      🚀 Convert to PDF
    </button>
  </form>
</section>
{% endblock %}
