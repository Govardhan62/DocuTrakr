<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/media/icons/doc.png" type="image/png" />
    <title>{% block title %}Docu Trakr{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-800 min-h-screen">
    <!-- Navbar -->
    <header class="bg-white shadow sticky top-0 z-50">
      <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="{% url 'process_document' %}" class="text-3xl font-bold primary-color flex items-center gap-2 hover:text-indigo-700 transition">
          <img src="/media/icons/doc.png" alt="Docu Trakr Icon" class="w-8 h-8 object-contain" />
          Docu Trakr
        </a>

        <div class="flex gap-4 items-center">
          <!-- Convert Buttons -->
          <a
            href="{% url 'convert_to_pdf' %}"
            class="px-4 py-2 rounded-lg border border-blue-700 text-blue-700 hover:bg-blue-50 transition font-semibold"
          >
            ⬇ Convert to PDF
          </a>
          <a
            href="{% url 'convert_to_doc' %}"
            class="px-4 py-2 rounded-lg border border-blue-700 text-blue-700 hover:bg-blue-50 transition font-semibold"
          >
            ⬇ Convert to DOC
          </a>
          
          <!-- Logout -->
          {% if user.is_authenticated %}
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button
              type="submit"
              class="px-5 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition font-semibold"
            >
              Logout
            </button>
          </form>
          {% endif %}
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto mt-14 px-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
