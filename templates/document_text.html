<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/media/icons/doc.png" type="image/png" />

  <title>Document Text - Docu Trakr</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fff;
      color: rgb(49, 0, 111);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .primary-border {
      border: 2px solid rgb(49, 0, 111);
      box-shadow: 0 0 8px rgb(49, 0, 111) inset, 0 0 8px rgb(49, 0, 111);
    }
    .primary-bg {
      background-color: rgb(49, 0, 111);
    }
    .primary-bg-light {
      background-color: rgba(49, 0, 111, 0.1);
    }
  </style>
</head>
<body>

  <div class="w-full max-w-5xl bg-white primary-border rounded-2xl shadow-lg p-8">

    <!-- Title -->
    <h1 class="text-4xl font-extrabold text-center mb-8 text-primary-border">
      📄 Document Text
    </h1>

    <!-- Document Content -->
    <pre class="whitespace-pre-wrap break-words p-6 rounded-lg border border-primary-border shadow-inner text-gray-900 text-base leading-relaxed max-h-[60vh] overflow-auto">
{{ text }}
    </pre>

    <!-- Buttons -->
    <div class="flex flex-wrap justify-center gap-4 mt-8">
      <a href="{% url 'process_document' %}"
         class="px-6 py-3 rounded-lg border border-primary-border text-primary-border font-semibold hover:bg-primary-bg-light transition">
        ⬅ Back
      </a>
      <a href="{% url 'download_as_pdf' document_id=document_id %}"
         class="px-6 py-3 rounded-lg border border-primary-border text-primary-border font-semibold hover:bg-primary-bg-light transition">
        ⬇ Download PDF
      </a>
      <a href="{% url 'download_as_docx' document_id=document_id %}"
         class="px-6 py-3 rounded-lg border border-primary-border text-primary-border font-semibold hover:bg-primary-bg-light transition">
        ⬇ Download DOCX
      </a>
    </div>
  </div>

</body>
</html>
